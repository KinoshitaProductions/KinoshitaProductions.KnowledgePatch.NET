name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json # Points to the file you created above
      - name: Build 
        shell: powershell
        run: |
          dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/KinoshitaProductions/index.json"
          dotnet workload restore --from-previous-sdk --project KinoshitaProductions.KnowledgePatch.csproj
          dotnet build KinoshitaProductions.KnowledgePatch.csproj
  build-uwp:
    name: Build (UWP)
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Build (UWP)
        shell: powershell
        run: |
          dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/KinoshitaProductions/index.json"
          dotnet workload restore --from-previous-sdk --project KinoshitaProductions.KnowledgePatch.csproj
          msbuild KinoshitaProductions.KnowledgePatch.UWP.csproj -t:restore
          msbuild KinoshitaProductions.KnowledgePatch.UWP.csproj -t:build -verbosity:diag /p:Configuration=Release
